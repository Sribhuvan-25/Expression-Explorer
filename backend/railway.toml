# Railway deployment config. Lives inside backend/ since Railway's config
# file does not follow a service's Root Directory setting -- it must sit
# where it applies. In the Railway dashboard, set this service's Root
# Directory to "backend" (Settings -> Source), which makes the Dockerfile
# path below and its COPY instructions resolve correctly against this
# directory rather than the repo root.
#
# The persistent volume is NOT configurable from this file -- Railway
# volumes are attached via the dashboard (Settings -> Volumes), mounted at
# /data/cache to match CACHE_DIR in app/config.py. See docs/deployment.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
# The container now pre-warms every dataset's cache (a ~5 minute, 530-file
# GDC download for target_all_p2, plus DepMap's own fetch) before uvicorn
# binds, so /health doesn't respond until that finishes. The old 30s
# timeout killed every deploy before the healthcheck could ever pass --
# confirmed in Railway's deploy diagnosis (Build/Deploy both succeeded,
# only Healthcheck failed, at exactly 30s). 900s covers a full cold
# double-dataset prewarm with real margin; every deploy after the first
# is fast since the persistent volume keeps the cache warm.
healthcheckTimeout = 900
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
