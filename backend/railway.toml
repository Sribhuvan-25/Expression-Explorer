# Railway deployment config. Lives inside backend/ since Railway's config
# file does not follow a service's Root Directory setting -- it must sit
# where it applies. In the Railway dashboard, set this service's Root
# Directory to "backend" (Settings -> Source), which makes the Dockerfile
# path below and its COPY instructions resolve correctly against this
# directory rather than the repo root.
#
# The persistent volume is NOT configurable from this file -- Railway
# volumes are attached via the dashboard (Settings -> Volumes), mounted at
# /data/cache to match CACHE_DIR in app/config.py. See docs/deployment.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
# 120s is now generous rather than tight: /health answers as soon as
# uvicorn binds, because dataset warm-up moved to a background thread
# inside the app (app/services/warmup.py). It does NOT wait on data.
#
# History, since the number moved twice and the reason matters:
#   30s  -> every deploy failed. Build and Deploy succeeded, Healthcheck
#           failed at exactly 30s, because the container ran a blocking
#           prewarm before binding.
#   900s -> bought time instead of fixing the race. Then the auxiliary
#           layers (METHODS.md 8) added a 739-file GDC MAF pull and a
#           198MB CRISPR matrix to that same blocking path, taking
#           measured cold start to ~848s of the 900s budget -- 94%
#           consumed, ~52s of headroom, from a home connection. GDC is
#           slower to datacenter IPs and the MAF loader retries up to 4x
#           per file, so the margin was plausibly negative in production.
#   120s -> the healthcheck no longer races a download at all. Adding a
#           dataset now lengthens warm-up, not the deploy.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
