<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#131A22"/>
  <!-- rungs (drawn first, so the strands sit on top at each crossing) -->
  <line x1="10.5" y1="6.5" x2="21.5" y2="6.5" stroke="#8FB6DE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8.3" y1="12.2" x2="23.7" y2="12.2" stroke="#8FB6DE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8.3" y1="19.8" x2="23.7" y2="19.8" stroke="#8FB6DE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10.5" y1="25.5" x2="21.5" y2="25.5" stroke="#8FB6DE" stroke-width="1.5" stroke-linecap="round"/>
  <!-- left strand (cool blue) -->
  <path d="M10.5 6.5 C6 9, 6 15, 16 16 C 6 17, 6 23, 10.5 25.5"
        fill="none" stroke="#2C6E9B" stroke-width="2.1" stroke-linecap="round"/>
  <!-- right strand (accent blue) -->
  <path d="M21.5 6.5 C26 9, 26 15, 16 16 C 26 17, 26 23, 21.5 25.5"
        fill="none" stroke="#4E86C9" stroke-width="2.1" stroke-linecap="round"/>
</svg>
